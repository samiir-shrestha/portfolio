<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg_grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b1120" />
      <stop offset="1" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="border_grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10b981" />
      <stop offset="0.5" stop-color="#06b6d4" />
      <stop offset="1" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="emerald_grad" x1="120" y1="140" x2="260" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34d399" />
      <stop offset="1" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="cyan_grad" x1="260" y1="320" x2="400" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8" />
      <stop offset="1" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base with Rounded Corners -->
  <rect width="512" height="512" rx="128" fill="url(#bg_grad)" />
  <rect x="16" y="16" width="480" height="480" rx="112" stroke="url(#border_grad)" stroke-width="16" fill="#0f172a" fill-opacity="0.9" />

  <!-- Subtle grid dots pattern -->
  <circle cx="96" cy="96" r="14" fill="#334155" opacity="0.3" />
  <circle cx="160" cy="96" r="14" fill="#334155" opacity="0.3" />
  <circle cx="224" cy="96" r="14" fill="#334155" opacity="0.3" />

  <!-- Glow filter group -->
  <g filter="url(#glow)">
    <!-- Terminal Prompt Chevron '>' -->
    <path d="M136 150 L256 256 L136 362" stroke="url(#emerald_grad)" stroke-width="52" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Cursor '_' -->
    <path d="M284 362 L392 362" stroke="url(#cyan_grad)" stroke-width="52" stroke-linecap="round" />
  </g>
</svg>
